name: Keep Streamlit Apps Awake

on:
  schedule:
    # 每 8 小時執行一次 (UTC)，低於 12 小時休眠門檻
    - cron: "0 */8 * * *"
  workflow_dispatch: # 可在 Actions 頁面手動執行測試

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit apps (and wake them if asleep)
        env:
          # 把下面換成你自己的 app 網址，一行一個
          APP_URLS: |
  https://kqdbalzj8hpf78ny4reedx.streamlit.app
  https://suypb6ilvp8ggkhnq8zjkm.streamlit.app
  https://（stock 的 streamlit_app.py 網址）
  https://（tw-scanner 的 scanner_app.py 網址）
  https://（money 另一個 app 的網址，如果也想保活）
        run: |
          cat > wake.py << 'EOF'
          import os
          import re
          from playwright.sync_api import sync_playwright

          urls = [u.strip() for u in os.environ["APP_URLS"].splitlines() if u.strip()]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for url in urls:
                  page = browser.new_page()
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      btn = page.get_by_role(
                          "button", name=re.compile("get this app back up", re.I)
                      )
                      try:
                          btn.wait_for(state="visible", timeout=10000)
                          btn.click()
                          print(f"[WOKE]  {url} 已按下喚醒按鈕")
                          page.wait_for_timeout(45000)  # 等 app 重新啟動
                      except Exception:
                          print(f"[AWAKE] {url} 本來就是醒著的")
                          page.wait_for_timeout(15000)  # 停留一下讓 websocket 連線，算作活動
                  except Exception as e:
                      print(f"[ERROR] {url}: {e}")
                  finally:
                      page.close()
              browser.close()
          EOF
          python wake.py
